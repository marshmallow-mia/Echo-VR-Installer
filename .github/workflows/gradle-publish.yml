# Builds the portable app images when a GitHub release is created and attaches them to that
# release as downloadable zips: the Linux image natively, and the Windows image cross-built on the
# same Linux runner (see the "Host vs. target" header in build.gradle).
#
# This must NOT be built on a developer machine running NixOS: jpackage bakes the build host's
# dynamic linker into the launcher, so a Nix-built image gets
# INTERP=/nix/store/<hash>-glibc-*/lib/ld-linux-x86-64.so.2 and dies at exec on every other distro.
# Building here on Ubuntu gives the normal /lib64/ld-linux-x86-64.so.2.

name: Gradle Package

on:
  release:
    types: [created]

jobs:
  build:

    # Pinned deliberately, do NOT move to ubuntu-latest: the portable image links against the
    # runner's glibc, so the runner sets the oldest distro we can run on. 22.04 ships glibc 2.35,
    # which covers Debian 12 (2.36) and Ubuntu 22.04+. ubuntu-latest is 24.04 (glibc 2.39) and
    # would silently drop Debian 12 support. For Debian 11 (2.31), build in a debian:11 container.
    #
    # The constraint above is about the LINUX image only; the Windows matrix entry is cross-built
    # here (no glibc involved) and shares the runner purely for simplicity.
    runs-on: ubuntu-22.04
    permissions:
      # write is required to attach the zip to the release
      contents: write

    strategy:
      # One target failing must still publish the other.
      fail-fast: false
      matrix:
        target: [ linux, windows ]

    steps:
    - uses: actions/checkout@v4

    # 21, not 17: the Windows cross-link feeds jlink the Temurin Windows 21.0.12.1 jmods and
    # jdk.tools.jlink.internal.JlinkTask refuses to link jmods whose feature+interim version differs
    # from jlink's own (see the "Windows JDK" comment block in build.gradle). Both targets share it
    # so the two jobs stay identical, and so the published runtimes are the same JDK.
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # fetchWindowsJdk unpacks a ~195 MB Temurin Windows JDK into $rootDir/.jdks/ — deliberately
    # outside build/ and therefore outside everything setup-gradle caches. Keyed on build.gradle so
    # bumping winJdkRelease invalidates the entry by itself.
    - name: Cache the Temurin Windows JDK (jmod source)
      if: matrix.target == 'windows'
      uses: actions/cache@v4
      with:
        path: |
          .jdks
          !.jdks/*.zip
        key: winjdk-${{ hashFiles('build.gradle') }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    # linux   -> the portable app image at build/jpackage/EchoVR_Installer/
    # windows -> build/windows-image/EchoVR_Installer/ plus the ready-made zip in
    #            build/distributions/ (jpackageImage is disabled in cross mode).
    # No installers are built — see build.gradle.
    - name: Build with Gradle
      run: ./gradlew -PtargetOs=${{ matrix.target }} build

    - name: Package portable app image
      id: package
      run: |
        set -euo pipefail
        TAG="${{ github.event.release.tag_name }}"
        case "${{ matrix.target }}" in
          linux)
            # Zip from inside build/jpackage so the archive has a single clean top-level
            # EchoVR_Installer/ folder. `zip` records the unix mode bits, so bin/EchoVR_Installer
            # and the bundled adb keep +x.
            ASSET="Echo_VR_Installer-${TAG}-linux-portable.zip"
            (cd build/jpackage && zip -qr "${GITHUB_WORKSPACE}/${ASSET}" EchoVR_Installer)
            ;;
          windows)
            # windowsPortableZip already wrote the archive — deliberately a Gradle Zip task rather
            # than the `zip` CLI, see build.gradle. Its name carries the hardcoded appVersionStr,
            # so only the filename needs rewriting to the release tag.
            ASSET="Echo_VR_Installer-${TAG}-windows-x64.zip"
            BUILT=(build/distributions/*-windows-x64.zip)
            if [ "${#BUILT[@]}" -ne 1 ] || [ ! -f "${BUILT[0]}" ]; then
              echo "Expected exactly one windows zip, found: ${BUILT[*]}" >&2
              exit 1
            fi
            mv "${BUILT[0]}" "${ASSET}"
            ;;
        esac
        echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"
        ls -lh "${ASSET}"

    # The two matrix jobs upload distinct filenames, so they can race harmlessly.
    - name: Attach zip to the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.package.outputs.asset }}" --clobber
