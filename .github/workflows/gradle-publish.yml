# Builds the portable Linux app image when a GitHub release is created and attaches it to that
# release as a downloadable zip.
#
# This must NOT be built on a developer machine running NixOS: jpackage bakes the build host's
# dynamic linker into the launcher, so a Nix-built image gets
# INTERP=/nix/store/<hash>-glibc-*/lib/ld-linux-x86-64.so.2 and dies at exec on every other distro.
# Building here on Ubuntu gives the normal /lib64/ld-linux-x86-64.so.2.

name: Gradle Package

on:
  release:
    types: [created]

jobs:
  build:

    # Pinned deliberately, do NOT move to ubuntu-latest: the portable image links against the
    # runner's glibc, so the runner sets the oldest distro we can run on. 22.04 ships glibc 2.35,
    # which covers Debian 12 (2.36) and Ubuntu 22.04+. ubuntu-latest is 24.04 (glibc 2.39) and
    # would silently drop Debian 12 support. For Debian 11 (2.31), build in a debian:11 container.
    runs-on: ubuntu-22.04
    permissions:
      # write is required to attach the zip to the release
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    # Produces the portable app image at build/jpackage/EchoVR_Installer/.
    # No installers are built — see build.gradle.
    - name: Build with Gradle
      run: ./gradlew build

    # Zip from inside build/jpackage so the archive has a single clean top-level EchoVR_Installer/
    # folder. `zip` records the unix mode bits, so bin/EchoVR_Installer and the bundled adb keep +x.
    - name: Package portable app image
      id: package
      run: |
        set -euo pipefail
        TAG="${{ github.event.release.tag_name }}"
        ASSET="Echo_VR_Installer-${TAG}-linux-portable.zip"
        cd build/jpackage
        zip -qr "../../${ASSET}" EchoVR_Installer
        cd ../..
        echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"
        ls -lh "${ASSET}"

    - name: Attach zip to the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.package.outputs.asset }}" --clobber
