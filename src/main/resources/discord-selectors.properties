# Discord server configuration
discord.server.invite=https://discord.gg/bMpsva6fmA

# Channel name containing the patch reaction message
discord.channel.name=quest-patch

# CSS selector for finding the channel in the sidebar
discord.channel.selector=[data-list-item-id*="channels"]

# The emoji shown on the reaction button (user must click this)
discord.reaction.emoji=🎮

# CSS selector for the message containing the reaction button
discord.message.selector=[class*="message"]

# CSS selector for detecting a newly created private thread
discord.thread.selector=[class*="thread"]

# Regex pattern to extract the patch URL from the thread message
discord.url.pattern=https://cdn\\.discordapp\\.com/attachments/.*/pnsovr\\.dll.*

# Timeout in seconds for auto-navigation operations
discord.timeout.seconds=30
